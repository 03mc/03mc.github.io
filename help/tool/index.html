<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="source" content="https://github.com/FlyCloudC/Utils-and-Games">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粘液科技合成小助手</title>
  <script src="assets/table.js"></script>
  <script src="assets/script.js"></script>
  <link rel="stylesheet" href="/styles/common.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>

<script>
  // 监听回车键事件
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      document.getElementById('query-button').click();
    }
  });
</script>

<body>
  <header class="primary">
    <h1><a href="/">第三世界</a></h1>
    <nav class="primary">
      <ul>
        <li><a href="/">首页</a></li>
        <li><a href="https://jq.qq.com/?_wv=1027&k=z52APpGR">加入玩家群</a></li>
        <li><a href="/help">帮助</a></li>
        <li><a href="/status">服务器状态</a></li>
        <li><a href="/map">地图</a></li>
      </ul>
      <button type="button">&#9776;</button>
    </nav>
  </header>
  <main>
    <div class="query-form">
      目标物品：<input id='target-input'></br>
      已有材料：<input id='ignore-input'></br>
      <button id='query-button' onclick='query()'>查询合成路线</button>
      <button id='show-all-button' onclick='showAllItem()'>查看全部物品</button>
    </div>
    <div class="output" style="margin: auto;">
      <p id='output'>请输入您需要查询的物品</p>
    </div>
  </main>

  <script src="/scripts/common.js"></script>

</body>

</html>
