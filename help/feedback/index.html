<!DOCTYPE html>
<html lang="zh_cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反馈</title>
  <link rel="stylesheet" href="/styles/common.css">
  <link rel="stylesheet" href="/help/assets/feedback.css" />
</head>

<body>
  <header class="primary">
    <h1><a href="/">第三世界</a></h1>
    <nav class="primary">
      <ul>
        <li><a href="/">首页</a></li>
        <li><a href="https://jq.qq.com/?_wv=1027&k=z52APpGR">加入玩家群</a></li>
        <li><a href="/help">帮助</a></li>
        <li><a href="/status">服务器状态</a></li>
        <li><a href="/map">地图</a></li>
      </ul>
      <button type="button">&#9776;</button>
    </nav>
  </header>
  <main>
    <section id="feedback-form">
      <form action="/submit-feedback" method="post">
        <label for="name">ID：</label>
        <input type="text" id="name" name="name" placeholder="请输入ID" required><br>

        <label for="type">反馈类型：</label>
        <select id="type" name="type" required>
          <option value="bug">漏洞报告</option>
          <option value="suggestion">功能建议</option>
          <option value="other">其他问题</option>
        </select><br>

        <label for="content">反馈内容：</label>
        <textarea id="content" name="content" rows="5" placeholder="请详细写下您的反馈" required></textarea><br>

        <input type="submit" value="提交反馈">
      </form>
    </section>
    <section id="feedback-list">
      <h2>已提交的反馈及修复状态</h2>
      <div id="feedback-items"></div>
    </section>
  </main>

  <script src="/scripts/common.js"></script>

</body>

</html>

<script>
  // 表单提交处理
  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.submitter;
    
    // 表单验证
    const nameInput = document.getElementById('name');
    const feedbackInput = document.getElementById('content');
    if (!nameInput.value.trim()) {
        showNotification('请输入姓名', 'error');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.value = '提交中...';

    try {
      const formData = new FormData(e.target);
const data = {
  name: e.target.name.value,
  type: e.target.type.value,
  content: e.target.content.value,
  timestamp: new Date().toISOString()
};

const response = await fetch('http://localhost:3000/submit-feedback', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify(data)
});

      if (response.ok) {
        showNotification('反馈提交成功！', 'success');
        e.target.reset();
        await loadFeedbackList(); // 提交成功后刷新列表
      }
    } catch (error) {
      showNotification('提交失败，请稍后重试', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.value = '提交反馈';
    }
  });

  // 加载反馈列表
  let currentPage = 1;
const pageSize = 10;

async function loadFeedbackList(page = 1) {
    try {
      const response = await fetch(`http://localhost:3000/get-feedback-list?page=${page}&limit=${pageSize}`);
      const { feedbacks, totalPages } = await response.json();
      currentPage = page;
      const container = document.getElementById('feedback-items');
      
      container.innerHTML = feedbacks.map(fb => `
        <div class="feedback-item">
  <div class="feedback-header">
    <strong>${fb.name}</strong>
    <span class="feedback-type ${fb.type}">${fb.type === 'bug' ? '漏洞' : fb.type === 'suggestion' ? '建议' : '其他'}</span>
    <span class="feedback-time">${new Date(fb.timestamp).toLocaleString()}</span>
  </div>
  <div class="feedback-content">${fb.content}</div>
  <span class="fixed-status">${fb.fixed ? '已修复' : '处理中'}</span>
</div>
      `).join('');
    } catch (error) {
      console.error('加载反馈列表失败:', error);
    }
  }

  // 通知组件
function showNotification(message, type) {
    const notice = document.createElement('div');
    notice.className = `notification ${type}`;
    notice.textContent = message;
    document.body.appendChild(notice);
    
    setTimeout(() => {
        notice.remove();
    }, 3000);
}

// 每30秒自动刷新
setInterval(loadFeedbackList, 30000);
// 分页控制
function updatePagination(totalPages) {
  const pagination = document.createElement('div');
  pagination.className = 'pagination';
  
  if(currentPage > 1) {
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '上一页';
    prevBtn.addEventListener('click', () => loadFeedbackList(currentPage - 1));
    pagination.appendChild(prevBtn);
  }
  
  const pageInfo = document.createElement('span');
  pageInfo.textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
  pagination.appendChild(pageInfo);
  
  if(currentPage < totalPages) {
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '下一页';
    nextBtn.addEventListener('click', () => loadFeedbackList(currentPage + 1));
    pagination.appendChild(nextBtn);
  }
  
  const container = document.getElementById('feedback-items');
  container.parentNode.insertBefore(pagination, container.nextSibling);
}

// 初始加载
loadFeedbackList(currentPage);
</script>
