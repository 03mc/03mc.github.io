<!DOCTYPE html>
<html lang="zh_cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles/common.css">
  <title>反馈</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    
    #feedback-form {
      width: 60%;
      margin: 20px auto;
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    input[type="submit"] {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    #feedback-list {
      width: 60%;
      margin: 20px auto;
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    #feedback-items {
      margin-top: 10px;
    }

    .feedback-item {
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }

    .feedback-item:last-child {
      border-bottom: none;
    }

    .fixed-status {
      color: green;
      font-weight: bold;
      margin-left: 10px;
    }
  </style>
</head>

<body>
  <header class="primary">
    <h1><a href="/">第三世界</a></h1>
    <nav class="primary">
      <ul>
        <li><a href="/">首页</a></li>
        <li><a href="https://jq.qq.com/?_wv=1027&k=z52APpGR">加入玩家群</a></li>
        <li><a href="/help">帮助</a></li>
        <li><a href="/status">服务器状态</a></li>
        <li><a href="/map">地图</a></li>
      </ul>
      <button type="button">&#9776;</button>
    </nav>
  </header>
  <main>
    <section id="feedback-form">
      <form action="submit-feedback" method="post">
        <label for="name">姓名：</label>
        <input type="text" id="name" name="name" placeholder="请输入您的姓名"><br>

        <label for="feedback">反馈内容：</label>
        <textarea id="feedback" name="feedback" rows="5" placeholder="请详细写下您的反馈" required></textarea><br>

        <input type="submit" value="提交反馈">
      </form>
    </section>
    <section id="feedback-list">
      <h2>已提交的反馈及修复状态</h2>
      <div id="feedback-items"></div>
    </section>
  </main>

  <script src="/scripts/common.js"></script>

</body>

</html>
