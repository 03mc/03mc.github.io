<!DOCTYPE html>
<html lang="zh_cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帮助</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="/styles/common.css">
  <link rel="stylesheet" href="/styles/bootstrap/css/bootstrap.min.css">
</head>

<body>
  <header class="primary">
    <h1><a href="/">第三世界</a></h1>
    <nav class="primary">
      <ul>
        <li><a href="/">首页</a></li>
        <li><a href="https://jq.qq.com/?_wv=1027&k=z52APpGR">加入玩家群</a></li>
        <li><a href="/help">帮助</a></li>
        <li><a href="/status">服务器状态</a></li>
        <li><a href="/map">地图</a></li>
      </ul>
      <button type="button">&#9776;</button>
    </nav>
  </header>
  <main>
    <div class="container py-5">
      <div class="row g-4">
        <div class="col-xl-3 col-md-6 col-sm-12">
          <div class="feature-card h-100">
            <h3 class="card-title"><a href="documentation">文档</a></h3>
            <p class="card-desc">关于服务器的玩家使用指南与插件指令</p>
          </div>
        </div>
        <div class="col-xl-3 col-md-6 col-sm-12">
          <div class="feature-card h-100">
            <h3 class="card-title"><a href="tool">工具</a></h3>
          <p>一些实用工具（目前只有粘液科技计算器</p>
          </div>
        </div>
        <div class="col-xl-3 col-md-6 col-sm-12">
          <div class="feature-card h-100">
            <h3 class="card-title"><a href="changelog">日志</a></h3>
            <p class="card-desc">更新日志、已修复的bug</p>
          </div>
        </div>
        <div class="col-xl-3 col-md-6 col-sm-12">
          <div class="feature-card h-100">
            <h3 class="card-title"><a href="feedback">反馈</a></h3>
            <p class="card-desc">反馈问题、建议</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/scripts/common.js"></script>
  <script>
    document.querySelectorAll('.feature-card').forEach(card => {
      card.style.cursor = 'pointer';
      card.addEventListener('click', (e) => {
        if (!e.target.closest('a')) {
          const link = card.querySelector('a');
          if (link) window.location.href = link.href;
        }
      });
    });
  </script>
</body>

</html>
