<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    header.primary {
      position: fixed;
      top: 0px;
      left: 0px;
      width: 100%;
      height: 62px;
      background-color: black;
      background-image: url("../images/header_bg.jpg");
      z-index: 99;
      font-family: 黑体;
    }

    header.primary h1 {
      position: fixed;
      left: 5%;
      font-size: 0;
    }

    header.primary h1 a {
      display: block;
      width: 168.259px;
      height: 90px;
      background-image: url("../images/logo.png");
      background-size: 100% 100%;
    }

    header.primary nav {
      position: fixed;
      right: 20%;
      height: 62px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: white;
      text-align: center;
      font-size: 20px;
    }

    nav.primary button {
      position: fixed;
      right: 2vw;
      height: 40px;
      width: 40px;
      font-size: 25px;
      display: none;
      background-color: transparent;
      color: #fff;
      border: none;
    }

    nav.primary ul {
      list-style-type: none;
      padding-left: 0;
    }

    nav.primary li {
      display: inline-block;
    }

    nav.primary a {
      color: white;
      text-decoration: none;
    }

    nav.primary a:hover {
      color: #fc0;
    }

    nav.primary li+li:before {
      content: "  |  ";
    }

    @media (max-width: 768px) {
      header.primary nav {
        top: 65px;
        right: 1%;
        height: auto;
        text-align: left;
        background-color: #353535;
        border-radius: 15px;
      }

      nav.primary button {
        top: 10px;
        display: block;
      }

      nav.primary ul {
        display: none;
      }

      header.primary li {
        display: block;
        padding: 10px 20px;
      }

      nav.primary li+li:before {
        content: none;
      }
    }
    @media (max-width: 376px) {
      header.primary nav {
        top: 62px;
        right: 0;
        width: 100vw;
        border-radius: 0;
      }
      header.primary h1 a {
        width: 116px;
        height: 62px;
      }
    }
  </style>
</head>

<body>
  <header class="primary">
    <h1><a href="/">第三世界</a></h1>
    <nav class="primary">
      <ul>
        <li><a href="/">首页</a></li>
        <li><a href="https://jq.qq.com/?_wv=1027&k=z52APpGR">加入玩家群</a></li>
        <li><a href="/help">帮助</a></li>
        <li><a href="/status">服务器状态</a></li>
        <li><a href="/map">地图</a></li>
      </ul>
      <button type="button">&#9776;</button>
    </nav>
  </header>
  <script>
    // 获取按钮和导航菜单元素
    const toggleButton = document.querySelector('nav.primary button');
    const navMenu = document.querySelector('nav.primary ul');

    // 为按钮添加点击事件监听器
    toggleButton.addEventListener('click', function() {
      // 切换导航菜单的显示状态
      if (navMenu.style.display === 'none' || navMenu.style.display === '') {
        navMenu.style.display = 'block';
      } else {
        navMenu.style.display = 'none';
      }
    });
  </script>
</body>

</html>
