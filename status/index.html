<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三世界服务器实时在线人数</title>
  <script src="/status/assets/mc-player-counter.min.js"></script>
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="stylesheet" href="/styles/common.css">

<body>
  <header class="primary">
    <h1><a href="/">第三世界</a></h1>
    <nav class="primary">
      <ul>
        <li><a href="/">首页</a></li>
        <li><a href="https://jq.qq.com/?_wv=1027&k=z52APpGR">加入玩家群</a></li>
        <li><a href="/help">帮助</a></li>
        <li><a href="/status">服务器状态</a></li>
        <li><a href="/map">地图</a></li>
      </ul>
      <button type="button">&#9776;</button>
    </nav>
  </header>
  <main>
    <section class="status-container">
      <!-- 一周目状态卡片 -->
      <div class="status-card">
        <h2 class="server-title">一周目服务器</h2>
        <div class="stats-box">
          <div class="stat-item">
            <i class="fas fa-users"></i>
            <span class="stat-label">在线人数：</span>
            <b class="player-count">
              <span data-playercounter-ip="mc1.03mc.com">加载中...</span>
            </b>
          </div>
          <div class="stat-item status-indicator">
            <i class="fas fa-signal"></i>
            <span data-playercounter-ip="mc1.03mc.com" data-playercounter-status="" class="status-badge"></span>
          </div>
        </div>
      </div>

      <!-- 二周目状态卡片 -->
      <div class="status-card">
        <h2 class="server-title">二周目服务器</h2>
        <div class="stats-box">
          <div class="stat-item">
            <i class="fas fa-users"></i>
            <span class="stat-label">在线人数：</span>
            <b class="player-count">
              <span data-playercounter-ip="mc2.03mc.com">加载中...</span>
            </b>
          </div>
          <div class="stat-item status-indicator">
            <i class="fas fa-signal"></i>
            <span data-playercounter-ip="mc2.03mc.com" data-playercounter-status="" class="status-badge"></span>
          </div>
        </div>
      </div>
    </section>
    <div class="update-info">
      <p>以下页面每1~4分钟更新一次</p>
    </div>
    <div class="links-container">
      <a href="http://03mc.com:50333/mc_script_player.html" target="_blank" class="status-link">查看服务器在线玩家</a>
      <a href="http://03mc.com:50333/chat/" target="_blank" class="status-link">查看玩家聊天</a>
      <a href="http://03mc.com:50333/mc_script_tps.html" target="_blank"
        class="status-link construction">查看服务器TPS（施工中）</a>
    </div>
  </main>
